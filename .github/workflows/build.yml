name: Build SMEazy POS (Tauri)

# Build a signed Windows desktop installer for SMEazy POS and publish it as a
# GitHub Release with an auto-update manifest (latest.json), consumed by the
# app's built-in "Check for Updates" (Settings → Software Update).
#
# Triggers:
#   - Manually (workflow_dispatch)
#   - On every push of a version tag like v2.5.0
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to publish the Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchains ─────────────────────────────────────────────────────────
      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── Frontend deps ──────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ── Build the API sidecar with the Tauri target-triple suffix ─────────
      # Tauri's externalBin expects the binary named  <name>-<target-triple>.exe
      # i.e. binaries/smeazy-api-x86_64-pc-windows-msvc.exe
      - name: Build API sidecar
        run: |
          cargo build --release -p smeazy-api --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item `
            "target/x86_64-pc-windows-msvc/release/smeazy-api.exe" `
            "src-tauri/binaries/smeazy-api-x86_64-pc-windows-msvc.exe" -Force
        shell: pwsh

      # ── Build, sign, and publish via the official Tauri action ────────────
      # Signs the installer + generates latest.json automatically when the
      # TAURI_SIGNING_PRIVATE_KEY secret is present (see README for setup).
      # releaseDraft: false so the release is published immediately — the
      # updater's "latest" endpoint only resolves to published (non-draft,
      # non-prerelease) releases.
      - name: Build and publish (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SMEazy POS ${{ github.ref_name }}"
          releaseBody: "See the changelog in README.md for what's new in this release."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # Also keep a plain downloadable artifact for manual (non-tag) runs.
      - name: Upload installer artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: smeazy-pos-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
