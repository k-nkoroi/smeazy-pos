[workspace]
resolver = "2"
members = [
  "crates/smeazy-domain",
  "crates/smeazy-common",
  "crates/smeazy-iam",
  "crates/smeazy-pos",
  "crates/smeazy-inventory",
  "crates/smeazy-kitchen",
  "crates/smeazy-analytics",
  "crates/smeazy-tables",
  "crates/smeazy-api",
]
# src-tauri is a standalone Tauri app crate with its own Cargo.toml —
# it must NOT be a workspace member (different dependency graph, own build).
exclude = [
  "src-tauri",
]

[workspace.dependencies]
# Core async
tokio       = { version = "1.35", features = ["full"] }
axum        = { version = "0.7.4" }
tower       = { version = "0.4.13" }
tower-http  = { version = "0.5.1", features = ["cors", "trace", "compression-gzip"] }

# Database — SQLite for offline-first (no Docker needed)
sqlx = { version = "0.7.4", features = [
  "sqlite", "uuid", "chrono", "runtime-tokio-rustls", "rust_decimal", "migrate"
] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Types
uuid         = { version = "1.6.1", features = ["v4", "serde"] }
chrono       = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.33", features = ["serde-with-str"] }

# Auth
jsonwebtoken = "9.2"
argon2       = "0.5.3"
rand         = "0.8"
hex          = "0.4"
ring         = { version = "0.17" }

# CSV processing
csv          = "1.3"

# Error handling
thiserror    = "1.0.56"
anyhow       = "1"

# Observability
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }

# Config
dotenvy = "0.15"

# Internal crates
smeazy-domain    = { path = "crates/smeazy-domain" }
smeazy-common    = { path = "crates/smeazy-common" }
smeazy-iam       = { path = "crates/smeazy-iam" }
smeazy-pos       = { path = "crates/smeazy-pos" }
smeazy-inventory = { path = "crates/smeazy-inventory" }
smeazy-kitchen   = { path = "crates/smeazy-kitchen" }
smeazy-analytics = { path = "crates/smeazy-analytics" }
smeazy-tables    = { path = "crates/smeazy-tables" }
